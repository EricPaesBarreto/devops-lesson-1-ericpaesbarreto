name: gh_test_python

on:
  push:

jobs:
  gh_test_python:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: install dependencies
        run: python -m pip install -r requirements.txt
      
      - name: print python version
        run: python --version

      - name: 'run tests'
        run: bash scripts/check-env.sh